<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Jack-o stats</title>
<style>
  :root { --bg:#f6efe2; --surface:#fffaf1; --ink:#3a281a; --fg:#2b1d12; --muted:#6e5a48; --line:rgba(58,40,26,.22); --accent:#e5782a; --good:#2e7d32; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:880px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:24px; margin:0 0 4px; color:var(--ink); }
  h2 { font-size:16px; margin:26px 0 10px; color:var(--ink); }
  .sub { color:var(--muted); margin:0 0 14px; font-size:13px; }
  .seg { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 4px; }
  .seg button { font:inherit; padding:7px 12px; border:1.5px solid var(--ink); border-radius:999px; background:var(--surface); color:var(--ink); cursor:pointer; }
  .seg button.on { background:var(--accent); color:#2b1d12; font-weight:600; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .card { background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; }
  .card b { display:block; font-size:26px; color:var(--ink); line-height:1.1; }
  .card span { color:var(--muted); font-size:13px; }
  .card.live { border-color:var(--accent); } .card.live b { font-size:30px; }
  .bars { background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:10px 14px; }
  .bar { display:grid; grid-template-columns:minmax(120px,38%) 1fr auto; gap:10px; align-items:center; padding:5px 0; }
  .bar + .bar { border-top:1px dashed var(--line); }
  .bar .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar .track { height:10px; background:rgba(58,40,26,.08); border-radius:6px; overflow:hidden; }
  .bar .fill { height:100%; background:var(--accent); border-radius:6px; }
  .bar .v { font-variant-numeric:tabular-nums; color:var(--ink); min-width:76px; text-align:right; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:640px) { .two { grid-template-columns:1fr; } }
  table { width:100%; border-collapse:collapse; background:var(--surface); border:1.5px solid var(--line); border-radius:12px; overflow:hidden; font-variant-numeric:tabular-nums; }
  th, td { padding:7px 10px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  .tablewrap { overflow-x:auto; }
  .note { color:var(--muted); font-size:13px; }
  .err { background:var(--surface); border:1.5px solid var(--ink); border-radius:12px; padding:16px; }
  a { color:var(--ink); }
  .bug { background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .bug .txt { white-space:pre-wrap; overflow-wrap:anywhere; margin:4px 0 8px; font-size:15px; }
  .bug .meta { color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
  .bug button { float:right; font:inherit; font-size:13px; padding:4px 10px; border:1.5px solid var(--ink); border-radius:999px; background:var(--surface); color:var(--ink); cursor:pointer; margin-left:8px; }
</style>
</head>
<body>
<main>
  <h1>🎃 Jack-o stats</h1>
  <p class="sub" id="asof">Loading…</p>
  <div class="seg" role="radiogroup" aria-label="Period">
    <button data-p="hour">This hour</button><button data-p="today" class="on">Today</button><button data-p="24h">24 hours</button><button data-p="7">7 days</button><button data-p="all">All</button><button data-p="update">Since update</button>
  </div>
  <div id="out"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const DAY = t => new Date(t - 7 * 3600000).toISOString().slice(0, 10);       // same day boundary as the server
const MODE = { "demo":"Free demo", "stream":"Stream mode", "pass":"Pumpkin Pass", "pass+eleven":"Pass + own ElevenLabs voice", "google-free":"Own Google key (free)", "google-unlocked":"Own Google key + $1.99 unlock",
  "openai-free":"Own OpenAI key (free)", "openai-unlocked":"Own OpenAI key + $1.99 unlock",
  "google-key+pass":"Own Google key, has a pass", "openai-key+pass":"Own OpenAI key, has a pass" };
let DATA = null, PERIOD = "today";
const SEEN = { "video":"Saw the video", "setup":"Reached Set it up", "freekey":"Saw the free key option", "moreoptions":"Saw More options", "startbutton":"Saw the Start button",
  "pumpkinpass":"Saw the Pumpkin Pass", "bottom":"Reached the bottom" };
const OPENED = { ownkey:"Free option (own key)", moreopts:"More options", phonetips:"Phone tips", privacy:"Privacy", morevoices:"Try other voices", elbox:"ElevenLabs voice",
  howgemini:"How do I get a key? (Google)", howopenai:"How do I get a key? (OpenAI)" };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const pct = (a, b) => b ? (100 * a / b).toFixed(a / b < 0.1 ? 1 : 0) + "%" : "–";
function days(everyDay) {
  const all = new Set([...Object.keys(DATA.events), ...Object.keys(DATA.loads), ...DATA.sales.map(s => DAY(s.at))]);
  const list = [...all].sort();
  if (everyDay) return list;
  if (PERIOD === "today") return [DAY(Date.now())];
  if (PERIOD === "7") { const cut = DAY(Date.now() - 6 * 86400000); return list.filter(d => d >= cut); }
  return list;
}
// The counts for the chosen period: a list of count objects, plus when the period starts (for sales).
function period() {
  const now = Date.now();
  if (PERIOD === "hour" || PERIOD === "24h") {
    const n = PERIOD === "hour" ? 1 : 24, keys = [];
    for (let i = 0; i < n; i++) keys.push(new Date(now - i * 3600000).toISOString().slice(0, 13));
    return { objs: keys.map(k => (DATA.hours || {})[k]).filter(Boolean), from: PERIOD === "hour" ? new Date(new Date().toISOString().slice(0, 13) + ":00:00Z").getTime() : now - 86400000, days: [] };
  }
  if (PERIOD === "update") {
    const b = Object.keys(DATA.builds || {}).sort().pop();
    return { objs: b ? [DATA.builds[b]] : [], from: b ? buildTime(b) : now, days: [], build: b };
  }
  const ds = days();
  return { objs: ds.map(d => DATA.events[d]).filter(Boolean), from: null, days: ds };
}
// Site versions are named by when they went out (Pacific time on the deploying Mac): 20261015152627.
const buildTime = b => new Date(+b.slice(0, 4), +b.slice(4, 6) - 1, +b.slice(6, 8), +b.slice(8, 10), +b.slice(10, 12), +b.slice(12, 14)).getTime();
const when = t => new Date(t).toLocaleString([], { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
function sum(objs, pick) {     // add up count objects
  const o = {};
  for (const e of objs) { const v = (e && pick(e)) || {}; for (const [k, n] of Object.entries(v)) o[k] = (o[k] || 0) + n; }
  return o;
}
function bars(obj, label = k => k, total, keepOrder) {
  const rows = keepOrder ? Object.entries(obj) : Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, 12);
  if (!rows.length) return '<div class="bars note">Nothing yet.</div>';
  const max = Math.max(1, ...rows.map(r => r[1])), tot = total || rows.reduce((a, r) => a + r[1], 0);
  return '<div class="bars">' + rows.map(([k, n]) => `<div class="bar"><div class="t" title="${esc(label(k))}">${esc(label(k))}</div>
    <div class="track"><div class="fill" style="width:${(100 * n / max).toFixed(1)}%"></div></div><div class="v">${n} · ${pct(n, tot)}</div></div>`).join("") + "</div>";
}
function render() {
  const P = period(), ds = P.days, set = new Set(ds);
  const u = sum(P.objs, d => d.u), n = sum(P.objs, d => d.n);
  const by = (obj, prefix) => Object.fromEntries(Object.entries(obj).filter(([k]) => k.startsWith(prefix + ":")).map(([k, v]) => [k.slice(prefix.length + 1), v]));
  const sales = P.from ? DATA.sales.filter(s => s.at >= P.from) : DATA.sales.filter(s => set.has(DAY(s.at)));
  const rev = sales.reduce((a, s) => a + (s.amount || 0), 0) / 100;
  const soldKinds = sales.reduce((o, s) => (o[s.kind] = (o[s.kind] || 0) + 1, o), {});
  const phones = u.load || 0, loads = ds.reduce((a, d) => a + (DATA.loads[d] || 0), 0);
  const multi = P.objs.length > 1 ? '<p class="note">This period adds up several days or hours, so a phone that came back in two of them counts twice.</p>' : "";
  const since = PERIOD === "update" ? (P.build ? '<p class="note"><b>Since the site update at ' + when(buildTime(P.build)) + '.</b> Only visits from that version count here.</p>' : '<p class="note">No visits counted on the newest version yet.</p>') : "";
  const realRem = (DATA.reminders || []).filter(x => !x.owner && !/@(example\.(com|org|net)|test\.com)$/.test(x.email));   // the owner's own sign-up doesn't count
  const rems = realRem.filter(x => P.from ? x.at >= P.from : set.has(DAY(x.at)));
  const funnel = { "Visited the site": u.load || 0, "Played a character's voice": u.hear || 0, "Tapped a buy button": u.buy || 0,
    "Came back from paying": u.paid_back || 0, "Asked for a reminder (email)": rems.length, "Tapped Start": u.start || 0, "Had a trick-or-treater (a conversation)": u.visit || 0 };
  $("out").innerHTML = `
    ${DATA.live ? `<div class="card live" style="margin-top:14px"><b>🎃 ${DATA.live.running}</b><span>pumpkins running right now${DATA.live.running ? ", " + DATA.live.talking + " talking to someone" : ""}.
      ${Object.entries(DATA.live.modes || {}).map(([k, v]) => v + " " + (MODE[k] || k)).join(" · ")} ${DATA.live.peakToday ? "<br>Today's peak: " + DATA.live.peakToday.running + " running, " + DATA.live.peakToday.talking + " talking at once." : ""}</span></div>` : ""}
    <div class="cards" style="margin-top:14px">
      <div class="card"><b>${phones}</b><span>phones visited</span></div>
      <div class="card"><b>${u.start || 0}</b><span>phones tapped Start</span></div>
      <div class="card"><b>${sales.length}</b><span>purchases</span></div>
      <div class="card"><b>$${rev.toFixed(2)}</b><span>revenue, before Stripe fees</span></div>
      <div class="card"><b>${pct(sales.length, phones)}</b><span>of visiting phones bought</span></div>
      <div class="card"><b>${n.visit || 0}</b><span>conversations with visitors</span></div>
      <div class="card"><b>${rems.length}</b><span>reminder emails (${realRem.length} in all)</span></div>
    </div>
    ${multi}${since}
    ${bugList(P, set)}
    <h2>Where people drop off (phones)</h2>
    ${bars(funnel, k => k, phones, true)}
    <p class="note">Percentages are of phones that visited. Buy taps: ${Object.entries(by(u, "buy")).map(([k, v]) => v + " " + k).join(", ") || "none"}. Sold: ${Object.entries(soldKinds).map(([k, v]) => v + " " + k).join(", ") || "none"}.</p>
    <h2>How far down the page people get (phones)</h2>
    ${bars(Object.fromEntries(["video","setup","freekey","moreoptions","startbutton","pumpkinpass","bottom"].map(k => [SEEN[k], (by(u, "seen")[k] || 0)])), k => k, phones, true)}
    <p class="note">Scrolled at least: ${["25","50","75","100"].map(k => k + "% " + pct(by(u, "scroll")[k] || 0, phones)).join(" · ")}. Stayed at least: ${["10s","30s","1m","3m"].map(k => k + " " + pct(by(u, "time")[k] || 0, phones)).join(" · ")}.</p>
    <h2>The video (phones)</h2>
    ${bars({ "Tapped Play video (our button)": (by(u, "vid").play || 0) + (by(u, "vid").sound_on || 0), "Played it with YouTube's controls": by(u, "vid").yt_play || 0, "Paused it": by(u, "vid").paused || 0 }, k => k, phones, true)}
    <p class="note">Before Oct 16 midday, "YouTube's controls" was counted wrongly on every visit; it now counts only real plays.</p>
    <h2>Halloween reminders</h2>
    ${bars({ "Left an email": rems.length, "Added it to their calendar": by(u, "remind").calendar || 0 }, k => k, phones, true)}
    <p class="note">${rems.length ? rems.slice(0, 30).map(x => esc(x.email) + " <span style='opacity:.6'>(" + when(x.at) + (x.cc ? ", " + esc(x.cc) : "") + (x.dev ? ", " + esc(x.dev) : "") + ")</span>").join("<br>") : "No sign-ups in this period."}</p>
    <p class="note"><a href="/api/reminders?csv=1">Download all reminder emails (CSV)</a></p>
    ${(() => { const real = realRem, n = k => real.filter(x => x[k]).length;
      return `<p class="note">${real.length} signed up · welcome sent ${n("welcome")} · Oct 24 reminder sent ${n("week")} · Oct 30 reminder sent ${n("eve")} · ${n("unsub")} unsubscribed.<br>
      Automatic: the welcome goes out right after sign-up; the reminders go out Sat Oct 24 and Fri Oct 30 at 10 AM Eastern.</p>
      <div class="seg"><button id="mailtest" type="button">Send all 3 as a test to me</button><button id="mailwelcome" type="button">Send the welcome to anyone who missed it</button></div><p class="note" id="mailmsg"></p>`; })()}
    <h2>Free demo (phones)</h2>
    ${bars({ "Tapped Try a free demo": by(u, "demo").start || 0, "Said No (not ready)": by(u, "demo").no || 0, "Said Yes": by(u, "demo").yes || 0,
      "Heard line 1": by(u, "demo").line1 || 0, "Heard line 2": by(u, "demo").line2 || 0, "Heard line 3": by(u, "demo").line3 || 0, "Heard line 4": by(u, "demo").line4 || 0,
      "Finished": by(u, "demo").over || 0, "Tapped Get a Pumpkin Pass after": by(u, "demo").pass || 0 }, k => k, phones, true)}
    <h2>What people opened or tapped (phones)</h2>
    ${bars(Object.assign({}, ...Object.entries(by(u, "open")).map(([k, v]) => ({ ["Opened: " + (OPENED[k] || k)]: v })),
        ...Object.entries(by(u, "click")).map(([k, v]) => ({ ["Tapped: " + (k === "scan" ? "Scan code" : k === "enter_key" ? "Enter key" : k)]: v })),
        ...Object.entries(by(u, "key")).map(([k, v]) => ({ ["Entered a " + (k === "openai" ? "OpenAI" : "Google") + " key"]: v })),
        { "Showed a code": u.code_show || 0 }), k => k, phones)}
    <h2>Characters (phones)</h2>
    <div class="two"><div>${bars(by(u, "hear"))}<p class="note">Played its voice.</p></div><div>${bars(by(u, "persona"))}<p class="note">Picked it (not the default).</p></div></div>
    <h2>How pumpkins run (phones that tapped Start)</h2>
    ${bars(by(u, "start"), k => MODE[k] || k)}
    <h2>Conversations by mode</h2>
    ${bars(by(n, "visit"), k => MODE[k] || k)}
    <p class="note">Battery ran out: ${u.drained || 0} phone(s). Showed the move-to-old-phone code: ${u.code_show || 0}. Scanned it: ${u.code_scan || 0}.</p>
    <div class="two">
      <div><h2>Where visitors came from</h2>${bars(sum(P.objs, d => d.src))}</div>
      <div><h2>Devices</h2>${bars(sum(P.objs, d => d.dev))}<h2>Countries</h2>${bars(sum(P.objs, d => d.cc))}</div>
    </div>
    <h2>By day</h2>
    <div class="tablewrap"><table><thead><tr><th>Day</th><th>Page loads</th><th>Phones</th><th>Heard</th><th>Buy taps</th><th>Sales</th><th>Revenue</th><th>Started</th><th>Conversations</th></tr></thead><tbody>
    ${[...days(true)].reverse().map(d => { const e = DATA.events[d] || { u:{}, n:{} }, s = DATA.sales.filter(x => DAY(x.at) === d);
      return `<tr><td>${d}</td><td>${DATA.loads[d] || 0}</td><td>${e.u.load || 0}</td><td>${e.u.hear || 0}</td><td>${e.u.buy || 0}</td><td>${s.length}</td><td>$${(s.reduce((a, x) => a + (x.amount || 0), 0) / 100).toFixed(2)}</td><td>${e.u.start || 0}</td><td>${e.n.visit || 0}</td></tr>`; }).join("")}
    </tbody></table></div>
    <h2>By site update</h2>
    <div class="tablewrap"><table><thead><tr><th>Version (went live)</th><th>Phones</th><th>Heard</th><th>Saw the Pass</th><th>Buy taps</th><th>Sales</th><th>Started</th><th>Conversations</th></tr></thead><tbody>
    ${(() => { const bs = Object.keys(DATA.builds || {}).sort(); return bs.map((b, i) => { const e = DATA.builds[b], t0 = buildTime(b), t1 = i + 1 < bs.length ? buildTime(bs[i + 1]) : Infinity, sl = DATA.sales.filter(x => x.at >= t0 && x.at < t1);
      return `<tr><td>${when(t0)}</td><td>${e.u.load || 0}</td><td>${e.u.hear || 0}</td><td>${e.u["seen:pumpkinpass"] || 0}</td><td>${e.u.buy || 0}</td><td>${sl.length}</td><td>${e.u.start || 0}</td><td>${e.n.visit || 0}</td></tr>`; }).reverse().join(""); })()}
    </tbody></table></div>
    <p class="note">Counting by version and by hour started Oct 15 around 3:30 PM.</p>
    <p class="note">"Page loads" is the older raw count. It includes reloads, and before Oct 15 afternoon it included the automatic reload after each site update. "Phones" counts each phone once a day (a random number stored on the phone, no personal data). Phone counts start Oct 15, 2026. Sales come from the payment records.</p>`;
}
function bugList(P, set) {
  const all = DATA.bugs || [], list = all.filter(x => P.from ? x.at >= P.from : set.has(DAY(x.at)));
  if (!list.length) return `<h2>Bug reports</h2><p class="note">None in this period${all.length ? " (" + all.length + " in all, see All)" : ""}.</p>`;
  return `<h2>Bug reports (${list.length})</h2>` + list.map(x => `<div class="bug"><button data-bug="${esc(x.id)}">Done, remove</button>
    <div class="meta">${when(x.at)} · ${esc(x.dev)} · ${esc(MODE[x.mode] || x.mode)} · ${esc(x.persona)}${x.cc ? " · " + esc(x.cc) : ""}${x.contact ? " · <b>" + esc(x.contact) + "</b>" : ""}</div>
    <div class="txt">${esc(x.text)}</div>
    <div class="meta">Version ${esc(x.b)} · ${esc(x.path)} · screen ${esc(x.scr)} · status "${esc(x.status)}"${x.model ? " · " + esc(x.model) : ""}${x.err ? "<br>Errors: " + esc(x.err) : ""}<br>${esc(x.ua)}</div></div>`).join("");
}
document.addEventListener("click", async e => {
  const id = e.target.dataset && e.target.dataset.bug; if (!id) return;
  e.target.disabled = true; await fetch("/api/bugs?id=" + encodeURIComponent(id), { method:"DELETE" }).catch(() => {});
  DATA.bugs = (DATA.bugs || []).filter(x => x.id !== id); render();
});
async function mailSend(body) {
  $("mailmsg").textContent = "Sending…";
  try { const r = await fetch("/api/reminders/send", { method:"POST", body: JSON.stringify(body) }), j = await r.json();
    $("mailmsg").textContent = j.ok ? "Sent " + j.sent + (j.test ? " test emails." : " emails." + (j.note ? " (" + j.note + ")" : "")) : "Not sent: " + j.error;
    if (j.ok && !j.test) load();
  } catch { $("mailmsg").textContent = "Not sent: check the connection."; }
}
document.addEventListener("click", e => {
  if (e.target.id === "mailtest") { const to = prompt("Send a test email to:"); if (to) mailSend({ test: to }); }
  if (e.target.id === "mailwelcome") mailSend({ kind: "welcome" });
});
async function load() {
  try {
    const r = await fetch("/api/stats/summary", { cache:"no-store" });
    if (r.status === 401) { $("asof").textContent = ""; $("out").innerHTML = '<div class="err">Sign in first: open <a href="/streaming">jack-o.io/streaming</a>, enter the password, then come back to <b>jack-o.io/stats</b>.</div>'; return; }
    DATA = await r.json(); $("asof").textContent = "Updated " + new Date().toLocaleTimeString([], { hour:"numeric", minute:"2-digit" }) + ". Refreshes every minute."; render();
  } catch { $("asof").textContent = "Couldn't load the numbers. Check the connection."; }
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { PERIOD = b.dataset.p; document.querySelectorAll(".seg button").forEach(x => x.classList.toggle("on", x === b)); if (DATA) render(); });
load(); setInterval(load, 60000);
</script>
</body>
</html>
